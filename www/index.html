<script>
"use strict";

// ---------------- Layout constants ----------------
var SPACING = 62;
var ROW_HEIGHT = 56;
var TOP_PAD = 20;

// Labels the student can tag a span with — the full set used across every
// lesson's answer key.
var LABELS = ["NP", "VP", "PP", "S", "CP", "AdjP", "AdvP"];

var LESSONS = [
  {
    "id": "constituents",
    "title": "What's a Constituent?",
    "teaser": "The foundation — how to tell a real phrase from a random string of words.",
    "theory": [
      "A constituent is a group of words that behaves like a single grammatical unit — it can be moved, replaced, or questioned as a block, while an arbitrary string of words usually can't.",
      "Linguists test for constituency: can the string be swapped for one pro-form (it, do so, there)? Can it be moved to the front of the sentence? Can it stand alone as the answer to a question?",
      "Every tree you draw should be built entirely out of constituents — no crossing branches, and every node should pass at least one of these tests."
    ],
    "example": {
      "sentence": "Birds fly.",
      "words": ["Birds", "fly"],
      "gold": [
        { "s": 0, "e": 0, "label": "NP" },
        { "s": 1, "e": 1, "label": "VP" },
        { "s": 0, "e": 1, "label": "S" }
      ]
    },
    "exercise": {
      "sentence": "The cat sleeps.",
      "words": ["The", "cat", "sleeps"],
      "gold": [
        { "s": 0, "e": 1, "label": "NP", "note": "\u201CThe cat\u201D groups the determiner and noun — swap it for \u201Cit\u201D and the sentence still works.", "test": "Pronoun substitution: \u201CIt sleeps.\u201D" },
        { "s": 2, "e": 2, "label": "VP", "note": "\u201Csleeps\u201D is the predicate — what the sentence says about the subject." },
        { "s": 0, "e": 2, "label": "S", "note": "The full sentence: subject NP + predicate VP." }
      ]
    }
  },
  {
    "id": "np",
    "title": "Noun Phrases (NP)",
    "teaser": "Determiners, adjectives, and how a PP can hide inside a noun phrase.",
    "theory": [
      "A noun phrase is built around a noun and can include a determiner (the, a), adjectives, and modifiers that follow the noun — most commonly prepositional phrases.",
      "Even when a PP modifies the noun (\u201Cthe man in the park\u201D), the whole string is usually one NP — the PP sits inside it rather than beside it.",
      "Test it: \u201Cthe man in the park\u201D can be replaced wholesale by \u201Che,\u201D which shows the determiner, noun, and PP together form a single constituent."
    ],
    "example": {
      "sentence": "The man in the park smiled.",
      "words": ["The", "man", "in", "the", "park", "smiled"],
      "gold": [
        { "s": 3, "e": 4, "label": "NP" },
        { "s": 2, "e": 4, "label": "PP" },
        { "s": 0, "e": 4, "label": "NP" },
        { "s": 5, "e": 5, "label": "VP" },
        { "s": 0, "e": 5, "label": "S" }
      ]
    },
    "exercise": {
      "sentence": "The book on the shelf fell.",
      "words": ["The", "book", "on", "the", "shelf", "fell"],
      "gold": [
        { "s": 3, "e": 4, "label": "NP", "note": "\u201Cthe shelf\u201D — object of the preposition \u201Con\u201D." },
        { "s": 2, "e": 4, "label": "PP", "note": "\u201Con the shelf\u201D — preposition plus its NP, modifying \u201Cbook\u201D." },
        { "s": 0, "e": 4, "label": "NP", "note": "Determiner + noun + modifying PP together form one subject NP.", "test": "Pronoun substitution: \u201CIt fell.\u201D" },
        { "s": 5, "e": 5, "label": "VP", "note": "\u201Cfell\u201D — the predicate, with no object." },
        { "s": 0, "e": 5, "label": "S" }
      ]
    }
  },
  {
    "id": "vp",
    "title": "Verb Phrases (VP) & Complements",
    "teaser": "The verb plus its objects — and why subject + verb usually isn't a unit.",
    "theory": [
      "A verb phrase is the predicate: the verb plus everything it needs to complete its meaning — objects and other complements — but never the subject.",
      "The classic test is \u201Cdo so\u201D replacement: if you can say \u201C...and so-and-so did so too,\u201D the verb and its complement(s) form one VP.",
      "Subjects and verbs almost never form a constituent on their own — \u201Cthe dog chased\u201D isn't a unit you can replace or move without the object."
    ],
    "example": {
      "sentence": "The girl ate an apple.",
      "words": ["The", "girl", "ate", "an", "apple"],
      "gold": [
        { "s": 0, "e": 1, "label": "NP" },
        { "s": 3, "e": 4, "label": "NP" },
        { "s": 2, "e": 4, "label": "VP" },
        { "s": 0, "e": 4, "label": "S" }
      ]
    },
    "exercise": {
      "sentence": "The dog chased the ball.",
      "words": ["The", "dog", "chased", "the", "ball"],
      "gold": [
        { "s": 0, "e": 1, "label": "NP", "note": "\u201CThe dog\u201D — determiner + noun, the subject." },
        { "s": 3, "e": 4, "label": "NP", "note": "\u201Cthe ball\u201D — the direct object." },
        { "s": 2, "e": 4, "label": "VP", "note": "The verb and its object form a unit that excludes the subject.", "test": "\u201CDo so\u201D replacement: \u201C...and the cat did so too.\u201D" },
        { "s": 0, "e": 4, "label": "S" }
      ]
    }
  },
  {
    "id": "pp-attach",
    "title": "PP Attachment",
    "teaser": "The same words, two trees, two meanings.",
    "theory": [
      "A prepositional phrase can attach in more than one place: inside an NP, modifying a noun, or inside a VP, modifying the whole action.",
      "The same sentence can have two completely different trees — and two different meanings — depending on where the PP attaches. That's structural ambiguity.",
      "\u201CI saw the woman with binoculars\u201D can mean the woman had binoculars (PP inside the object NP) or that you used binoculars to see her (PP inside the VP)."
    ],
    "example": {
      "sentence": "I saw the woman with binoculars.",
      "words": ["I", "saw", "the", "woman", "with", "binoculars"],
      "gold": [
        { "s": 0, "e": 0, "label": "NP" },
        { "s": 2, "e": 3, "label": "NP" },
        { "s": 4, "e": 5, "label": "PP" },
        { "s": 1, "e": 5, "label": "VP" },
        { "s": 0, "e": 5, "label": "S" }
      ]
    },
    "exercise": {
      "sentence": "The boy saw the man with the telescope.",
      "words": ["The", "boy", "saw", "the", "man", "with", "the", "telescope"],
      "gold": [
        { "s": 0, "e": 1, "label": "NP", "note": "\u201CThe boy\u201D — the subject." },
        { "s": 3, "e": 4, "label": "NP", "note": "\u201Cthe man\u201D — the direct object, the person seen." },
        { "s": 6, "e": 7, "label": "NP", "note": "\u201Cthe telescope\u201D — object of the preposition \u201Cwith\u201D." },
        { "s": 5, "e": 7, "label": "PP", "note": "\u201Cwith the telescope\u201D — preposition plus its NP." },
        { "s": 2, "e": 7, "label": "VP", "note": "The PP attaches high, to the VP: the boy used the telescope to see. This is the instrument reading." },
        { "s": 0, "e": 7, "label": "S" }
      ]
    }
  },
  {
    "id": "cp",
    "title": "Clauses & Complementizers (CP)",
    "teaser": "Embedded clauses, \u201Cthat,\u201D and verbs that take a whole clause as their object.",
    "theory": [
      "Some verbs take a whole clause as their complement, introduced by a complementizer like \u201Cthat,\u201D \u201Cwhether,\u201D or \u201Cif.\u201D",
      "That complementizer plus the clause it introduces together form a CP: \u201Cthat he will win\u201D = Comp + S.",
      "The matrix VP then contains the main verb plus its CP complement, just like a VP can contain a verb plus an NP object."
    ],
    "example": {
      "sentence": "He said that she left.",
      "words": ["He", "said", "that", "she", "left"],
      "gold": [
        { "s": 0, "e": 0, "label": "NP" },
        { "s": 3, "e": 3, "label": "NP" },
        { "s": 4, "e": 4, "label": "VP" },
        { "s": 3, "e": 4, "label": "S" },
        { "s": 2, "e": 4, "label": "CP" },
        { "s": 1, "e": 4, "label": "VP" },
        { "s": 0, "e": 4, "label": "S" }
      ]
    },
    "exercise": {
      "sentence": "She thinks that he will win.",
      "words": ["She", "thinks", "that", "he", "will", "win"],
      "gold": [
        { "s": 0, "e": 0, "label": "NP", "note": "A bare pronoun can be a full NP on its own." },
        { "s": 3, "e": 3, "label": "NP", "note": "\u201Che\u201D — subject of the embedded clause." },
        { "s": 4, "e": 5, "label": "VP", "note": "\u201Cwill win\u201D — auxiliary plus main verb." },
        { "s": 3, "e": 5, "label": "S", "note": "The embedded clause has its own subject and predicate." },
        { "s": 2, "e": 5, "label": "CP", "note": "The complementizer \u201Cthat\u201D plus the clause it introduces.", "test": "CP = Comp + S" },
        { "s": 1, "e": 5, "label": "VP", "note": "The main verb plus its entire clausal complement.", "test": "\u201Cthinks\u201D takes a CP complement." },
        { "s": 0, "e": 5, "label": "S" }
      ]
    }
  },
  {
    "id": "intro-syntax",
    "title": "Introduction to Syntax and Grammar",
    "teaser": "What syntax studies, and why word order isn't just convention.",
    "theory": [
      "Syntax is the study of how words combine to form phrases and sentences, and why some combinations are grammatical while others aren't, regardless of meaning.",
      "Speakers of a language have tacit knowledge of its syntax: they can judge a sentence as well-formed or not even without being able to state the rule.",
      "A grammar is a formal system of rules or principles that generates all and only the grammatical sentences of a language."
    ],
    "example": {
      "sentence": "Dogs bark.",
      "words": ["Dogs", "bark"],
      "gold": [
        { "s": 0, "e": 0, "label": "NP" },
        { "s": 1, "e": 1, "label": "VP" },
        { "s": 0, "e": 1, "label": "S" }
      ]
    },
    "exercise": {
      "sentence": "Birds sing loudly.",
      "words": ["Birds", "sing", "loudly"],
      "gold": [
        { "s": 0, "e": 0, "label": "NP", "note": "\u201CBirds\u201D — a bare NP subject." },
        { "s": 2, "e": 2, "label": "AdvP", "note": "\u201Cloudly\u201D modifies the verb — an adverb phrase." },
        { "s": 1, "e": 2, "label": "VP", "note": "The verb plus its adverbial modifier form the predicate.", "test": "Do so: \u201C...and the cat did so too, loudly.\u201D" },
        { "s": 0, "e": 2, "label": "S" }
      ]
    }
  },
  {
    "id": "parts-of-speech",
    "title": "Parts of Speech and Lexical Categories",
    "teaser": "Nouns, verbs, adjectives, and how category determines what a word can do.",
    "theory": [
      "Words belong to lexical categories — noun (N), verb (V), adjective (A), adverb (Adv), preposition (P) — based on their form, meaning, and distribution, not just meaning alone.",
      "Category determines what a word can combine with: a determiner precedes a noun, an adverb can modify a verb or adjective, only verbs take tense.",
      "Phrasal categories are built around a lexical head of the same category: a noun phrase is headed by a noun, a verb phrase by a verb."
    ],
    "example": {
      "sentence": "The tall man left.",
      "words": ["The", "tall", "man", "left"],
      "gold": [
        { "s": 1, "e": 1, "label": "AdjP" },
        { "s": 0, "e": 2, "label": "NP" },
        { "s": 3, "e": 3, "label": "VP" },
        { "s": 0, "e": 3, "label": "S" }
      ]
    },
    "exercise": {
      "sentence": "The very tall man arrived quickly.",
      "words": ["The", "very", "tall", "man", "arrived", "quickly"],
      "gold": [
        { "s": 1, "e": 2, "label": "AdjP", "note": "\u201Cvery tall\u201D — degree word + adjective form one adjective phrase." },
        { "s": 0, "e": 3, "label": "NP", "note": "Determiner + AdjP + noun combine into one NP headed by \u201Cman\u201D.", "test": "Pronoun substitution: \u201CHe arrived quickly.\u201D" },
        { "s": 5, "e": 5, "label": "AdvP", "note": "\u201Cquickly\u201D — a single adverb phrase modifying the verb." },
        { "s": 4, "e": 5, "label": "VP", "note": "The verb plus its adverbial modifier." },
        { "s": 0, "e": 5, "label": "S" }
      ]
    }
  },
  {
    "id": "phrases-clauses-sentences",
    "title": "Phrases, Clauses, and Sentences",
    "teaser": "Why a clause has a subject and predicate, and a sentence can hold more than one.",
    "theory": [
      "A phrase is a group of words built around one head, like an NP or PP, with no subject-predicate structure of its own.",
      "A clause contains a subject and a predicate, built around a verb — it can stand as a sentence, or be embedded inside another clause.",
      "A sentence is the largest structural unit built from one or more clauses combined, often by a complementizer or conjunction."
    ],
    "example": {
      "sentence": "She knows that he left.",
      "words": ["She", "knows", "that", "he", "left"],
      "gold": [
        { "s": 0, "e": 0, "label": "NP" },
        { "s": 3, "e": 3, "label": "NP" },
        { "s": 4, "e": 4, "label": "VP" },
        { "s": 3, "e": 4, "label": "S" },
        { "s": 2, "e": 4, "label": "CP" },
        { "s": 1, "e": 4, "label": "VP" },
        { "s": 0, "e": 4, "label": "S" }
      ]
    },
    "exercise": {
      "sentence": "I believe that the plan worked.",
      "words": ["I", "believe", "that", "the", "plan", "worked"],
      "gold": [
        { "s": 0, "e": 0, "label": "NP", "note": "\u201CI\u201D — a bare pronoun NP, the matrix subject." },
        { "s": 3, "e": 4, "label": "NP", "note": "\u201Cthe plan\u201D — subject of the embedded clause." },
        { "s": 5, "e": 5, "label": "VP", "note": "\u201Cworked\u201D — predicate of the embedded clause." },
        { "s": 3, "e": 5, "label": "S", "note": "The embedded clause: its own subject + predicate." },
        { "s": 2, "e": 5, "label": "CP", "note": "Complementizer \u201Cthat\u201D plus the clause it introduces.", "test": "CP = Comp + S" },
        { "s": 1, "e": 5, "label": "VP", "note": "The matrix verb plus its clausal complement." },
        { "s": 0, "e": 5, "label": "S" }
      ]
    }
  },
  {
    "id": "head-complements-adjuncts",
    "title": "Head, Complements, and Adjuncts",
    "teaser": "Every phrase has one head — and complements are required where adjuncts are optional.",
    "theory": [
      "Every phrase has a head that determines its category and core meaning — everything else in the phrase relates back to that head.",
      "A complement is selected by the head and often obligatory — a verb like \u201Cput\u201D needs both an object and a location to be complete.",
      "An adjunct is optional and can be added or removed without making the sentence ungrammatical — adjuncts modify, complements complete."
    ],
    "example": {
      "sentence": "She read the book.",
      "words": ["She", "read", "the", "book"],
      "gold": [
        { "s": 0, "e": 0, "label": "NP" },
        { "s": 2, "e": 3, "label": "NP" },
        { "s": 1, "e": 3, "label": "VP" },
        { "s": 0, "e": 3, "label": "S" }
      ]
    },
    "exercise": {
      "sentence": "She read the book yesterday.",
      "words": ["She", "read", "the", "book", "yesterday"],
      "gold": [
        { "s": 0, "e": 0, "label": "NP", "note": "The subject." },

// ---------------- Shared layout math ----------------
function keyOf(s, e) { return s + "_" + e; }
function mapFromGold(gold) {
  var map = {};
  gold.forEach(function (g) { map[keyOf(g.s, g.e)] = g.label; });
  return map;
}

function buildForest(start, end, map, excludeKey) {
  var nodes = [];
  var i = start;
  while (i <= end) {
    var best = null;
    Object.keys(map).forEach(function (k) {
      if (k === excludeKey) return;
      var parts = k.split("_").map(Number);
      var s = parts[0], e = parts[1];
      if (s === i && e <= end && (!best || e > best.e)) best = { s: s, e: e, label: map[k] };
    });
    if (best) {
      var childKey = keyOf(best.s, best.e);
      nodes.push({ type: "node", s: best.s, e: best.e, label: best.label, children: buildForest(best.s, best.e, map, childKey) });
      i = best.e + 1;
    } else {
      nodes.push({ type: "leaf", s: i, e: i, index: i });
      i++;
    }
  }
  return nodes;
}
function heightOf(node) {
  if (node.type === "leaf") return 0;
  return 1 + Math.max.apply(null, node.children.map(heightOf));
}
function xOf(s, e) {
  return ((s + e) / 2) * SPACING + SPACING / 2;
}
function flatten(node, maxHeight, words, out) {
  var x = xOf(node.s, node.e);
  if (node.type === "leaf") {
    var y0 = maxHeight * ROW_HEIGHT + TOP_PAD;
    out.leaves.push({ x: x, y: y0, word: words[node.index] });
    return { x: x, y: y0 };
  }
  var h = heightOf(node);
  var y = (maxHeight - h) * ROW_HEIGHT + TOP_PAD;
  var childPos = node.children.map(function (c) { return flatten(c, maxHeight, words, out); });
  childPos.forEach(function (cp) { out.edges.push({ x1: x, y1: y + 12, x2: cp.x, y2: cp.y - 12 }); });
  out.pills.push({ x: x, y: y, label: node.label, s: node.s, e: node.e });
  return { x: x, y: y };
}
// Builds a renderable layout (pill positions + connecting edges) from any
// list of {s,e,label} nodes — used for gold trees AND the student's own
// in-progress tree, since both are just span/label lists.
function computeLayout(words, nodeList) {
  var map = mapFromGold(nodeList);
  var forest = buildForest(0, words.length - 1, map);
  var maxHeight = Math.max.apply(null, [0].concat(forest.map(heightOf)));
  var out = { pills: [], edges: [], leaves: [] };
  forest.forEach(function (n) { flatten(n, maxHeight, words, out); });
  var width = Math.max(words.length * SPACING, 160);
  var height = (maxHeight + 1) * ROW_HEIGHT + TOP_PAD + 12;
  return { width: width, height: height, nodes: out.pills, edges: out.edges };
}

// ---------------- DOM helpers ----------------
function el(tag, cls) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  return e;
}
function svgEl(tag) {
  return document.createElementNS("http://www.w3.org/2000/svg", tag);
}

function renderTreeDiagram(words, nodeList, pillClass) {
  var layout = computeLayout(words, nodeList);
  var wrap = el("div", "tree-diagram");
  wrap.style.width = layout.width + "px";
  wrap.style.height = layout.height + "px";
  var svg = svgEl("svg");
  svg.setAttribute("width", layout.width);
  svg.setAttribute("height", layout.height);
  svg.style.position = "absolute"; svg.style.top = "0"; svg.style.left = "0";
  layout.edges.forEach(function (e) {
    var line = svgEl("line");
    line.setAttribute("x1", e.x1); line.setAttribute("y1", e.y1);
    line.setAttribute("x2", e.x2); line.setAttribute("y2", e.y2);
    line.setAttribute("stroke", "#B9B3A3"); line.setAttribute("stroke-width", "1.5");
    svg.appendChild(line);
  });
  wrap.appendChild(svg);
  layout.nodes.forEach(function (p) {
    var pill = el("div", "tree-pill " + pillClass);
    pill.style.left = p.x + "px"; pill.style.top = p.y + "px";
    pill.textContent = p.label;
    wrap.appendChild(pill);
  });
  return wrap;
}

function renderOverlay(goldLayout, statuses) {
  var wrap = el("div", "correction-overlay");
  wrap.style.position = "absolute"; wrap.style.top = "0"; wrap.style.left = "0";
  wrap.style.width = goldLayout.width + "px"; wrap.style.height = goldLayout.height + "px";
  wrap.style.pointerEvents = "none";
  var svg = svgEl("svg");
  svg.setAttribute("width", goldLayout.width); svg.setAttribute("height", goldLayout.height);
  svg.style.position = "absolute"; svg.style.top = "0"; svg.style.left = "0";
  goldLayout.edges.forEach(function (e) {
    var line = svgEl("line");
    line.setAttribute("x1", e.x1); line.setAttribute("y1", e.y1);
    line.setAttribute("x2", e.x2); line.setAttribute("y2", e.y2);
    line.setAttribute("stroke", "#8A8477"); line.setAttribute("stroke-width", "1.2");
    line.setAttribute("stroke-dasharray", "3,3"); line.setAttribute("opacity", "0.6");
    svg.appendChild(line);
  });
  wrap.appendChild(svg);
  var colors = { correct: "#3F6B52", missing: "#A6482F", wrong_label: "#B8863B", extra: "#8A8477" };
  statuses.forEach(function (s) {
    var color = colors[s.status] || colors.extra;
    var text;
    if (s.status === "correct") text = "\u2713 " + s.label;
    else if (s.status === "missing") text = "+ " + s.label;
    else if (s.status === "wrong_label") text = (s.userLabel || "?") + " \u2192 " + s.label;
    else text = s.label;
    var pill = el("div", "overlay-pill");
    pill.style.left = s.x + "px"; pill.style.top = s.y + "px";
    pill.style.borderColor = color; pill.style.color = color;
    pill.textContent = text;
    wrap.appendChild(pill);
  });
  return wrap;
}

function renderWordRow(words, width, selStart, selEnd, onClick) {
  var wrap = el("div", "word-row");
  wrap.style.width = width + "px";
  words.forEach(function (w, i) {
    var isSel = selStart !== null && i >= selStart && i <= selEnd;
    var btn = el("button", "word-btn" + (isSel ? " word-btn-selected" : ""));
    btn.style.left = xOf(i, i) + "px";
    btn.textContent = w;
    btn.onclick = function () { onClick(i); };
    wrap.appendChild(btn);
  });
  return wrap;
}

}
function addLabel(label) {
  var s = lessonState.selStart, e = lessonState.selEnd;
  lessonState.nodes = lessonState.nodes.filter(function (n) { return !(n.s === s && n.e === e); });
  lessonState.nodes.push({ s: s, e: e, label: label });
  cancelSelection();
}
function removeNode(s, e) {
  lessonState.overlay = null;
  lessonState.nodes = lessonState.nodes.filter(function (n) { return !(n.s === s && n.e === e); });
  refreshExercise();
}

function checkTree(lesson) {
  var ex = lesson.exercise;
  if (lessonState.nodes.length === 0) {
    lessonState.hint = "Build a tree first \u2014 tap two words to select a span, then choose a label.";
    refreshExercise();
    return;
  }
  lessonState.hint = null;
  var goldLayout = computeLayout(ex.words, ex.gold);
  var statuses = goldLayout.nodes.map(function (g) {
    var match = lessonState.nodes.filter(function (n) { return n.s === g.s && n.e === g.e; })[0];
    var status;
    if (!match) status = "missing";
    else if (match.label === g.label) status = "correct";
    else status = "wrong_label";
    var goldNode = ex.gold.filter(function (gg) { return gg.s === g.s && gg.e === g.e; })[0];
    return {
      x: g.x, y: g.y, s: g.s, e: g.e, label: g.label,
      note: goldNode ? goldNode.note : null,
      test: goldNode ? goldNode.test : null,
      status: status,
      userLabel: match ? match.label : null
    };
  });
  var extra = lessonState.nodes.filter(function (n) {
    return !ex.gold.some(function (g) { return g.s === n.s && g.e === n.e; });
  });
  lessonState.overlay = { statuses: statuses, extra: extra };
  var perfect = statuses.every(function (s) { return s.status === "correct"; }) && extra.length === 0;
  if (perfect) { scores[lesson.id] = true; saveScores(); }
  refreshExercise();
}

function renderResultPanel(lesson) {
  var ex = lesson.exercise;
  var overlay = lessonState.overlay;
  var correctCount = overlay.statuses.filter(function (s) { return s.status === "correct"; }).length;
  var wrongOrMissing = overlay.statuses.filter(function (s) { return s.status !== "correct"; });
  var perfect = correctCount === overlay.statuses.length && overlay.extra.length === 0;

  var box = el("div", "result-box");
  var header = el("div", "result-header");
  var countP = el("p", "result-count"); countP.textContent = correctCount + "/" + overlay.statuses.length + " constituents correct";
  header.appendChild(countP);
  if (perfect) {
    var badge = el("span", "perfect-badge"); badge.innerHTML = "\u2726 Perfect parse";
    header.appendChild(badge);
  }
  box.appendChild(header);

  var list = el("div", "result-list");
  wrongOrMissing.forEach(function (s) {
    var row = el("div", "result-row");
    var tag = el("span", s.status === "missing" ? "tag tag-missing" : "tag tag-label");
    tag.textContent = s.status === "missing" ? "missing" : "label";
    row.appendChild(tag);
    var textWrap = el("div");
    var p = el("p", "result-line");
    var labelSpan = el("span", "inline-pill"); labelSpan.textContent = s.label;
    p.appendChild(labelSpan);
    p.appendChild(document.createTextNode(' "' + ex.words.slice(s.s, s.e + 1).join(" ") + '"'));
    if (s.status === "wrong_label" && s.userLabel) p.appendChild(document.createTextNode(" \u2014 you wrote " + s.userLabel));
    textWrap.appendChild(p);
    if (s.note) {
      var noteP = el("p", "result-note");
      noteP.textContent = s.note + (s.test ? " (" + s.test + ")" : "");
      textWrap.appendChild(noteP);
    }
    row.appendChild(textWrap);
    list.appendChild(row);
  });
  overlay.extra.forEach(function (n) {
    var row = el("div", "result-row");
    var tag = el("span", "tag tag-extra"); tag.textContent = "extra";
    row.appendChild(tag);
    var p = el("p", "result-line");
    var labelSpan = el("span", "inline-pill"); labelSpan.textContent = n.label;
    p.appendChild(labelSpan);
    p.appendChild(document.createTextNode(' "' + ex.words.slice(n.s, n.e + 1).join(" ") + '" isn\u2019t one of the target constituents here.'));
    row.appendChild(p);
    list.appendChild(row);
  });
  if (wrongOrMissing.length === 0 && overlay.extra.length === 0) {
    var okP = el("p", "all-good"); okP.textContent = "Every constituent checks out. Nicely built.";
    list.appendChild(okP);
  }
  box.appendChild(list);
  return box;
}

function refreshExercise() {
  var lesson = lessonRefs.lesson;
  var innerWrap = lessonRefs.innerWrap;
  var labelPickerHolder = lessonRefs.labelPickerHolder;
  var chipsHolder = lessonRefs.chipsHolder;
  var hintHolder = lessonRefs.hintHolder;
  var resultHolder = lessonRefs.resultHolder;
  var ex = lesson.exercise;
  var goldLayout = computeLayout(ex.words, ex.gold);

  innerWrap.innerHTML = "";
  innerWrap.style.width = goldLayout.width + "px";

  var treeWrap = el("div", "tree-relative");
  treeWrap.appendChild(renderTreeDiagram(ex.words, lessonState.nodes, "pill-blue"));
  if (lessonState.overlay) treeWrap.appendChild(renderOverlay(goldLayout, lessonState.overlay.statuses));
  innerWrap.appendChild(treeWrap);
  innerWrap.appendChild(renderWordRow(ex.words, goldLayout.width, lessonState.selStart, lessonState.selEnd, clickWord));

  labelPickerHolder.innerHTML = "";
  if (lessonState.selStart !== null) {
    var cap = el("p", "label-picker-caption");
    cap.textContent = 'Label "' + ex.words.slice(lessonState.selStart, lessonState.selEnd + 1).join(" ") + '" as:';
    labelPickerHolder.appendChild(cap);
    var row = el("div", "label-row");
    LABELS.forEach(function (label) {
      var b = el("button", "label-btn"); b.textContent = label;
      b.onclick = function () { addLabel(label); };
      row.appendChild(b);
    });
    var cancel = el("button", "cancel-btn"); cancel.innerHTML = "\u21BA cancel";
    cancel.onclick = cancelSelection;
    row.appendChild(cancel);
    labelPickerHolder.appendChild(row);
  }

  chipsHolder.innerHTML = "";
  if (lessonState.nodes.length > 0) {
    var chipsRow = el("div", "chips-row");
    lessonState.nodes.forEach(function (n) {
      var chip = el("span", "chip");
      var lab = el("span", "chip-label"); lab.textContent = n.label;
      chip.appendChild(lab);
      chip.appendChild(document.createTextNode(" " + ex.words.slice(n.s, n.e + 1).join(" ") + " "));
      var rm = el("button", "chip-remove"); rm.textContent = "\u2715";
      rm.onclick = function () { removeNode(n.s, n.e); };
      chip.appendChild(rm);
      chipsRow.appendChild(chip);
    });
    chipsHolder.appendChild(chipsRow);
  }

  hintHolder.textContent = lessonState.hint || "";
  hintHolder.style.display = lessonState.hint ? "block" : "none";

  resultHolder.innerHTML = "";
  if (lessonState.overlay) resultHolder.appendChild(renderResultPanel(lesson));
}

renderApp();
</script>
</body>
