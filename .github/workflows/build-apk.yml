name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  # Your AdMob App ID.
  ADMOB_APP_ID: "ca-app-pub-9195867417549907~7389878691"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install npm dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icons
        run: |
          npm install --no-save @capacitor/assets
          npx capacitor-assets generate --android \
            --iconBackgroundColor '#061528' --iconBackgroundColorDark '#061528'

      - name: Configure Android for AdMob
        run: |
          # AdMob's SDK needs minSdk 23+
          sed -i 's/minSdkVersion = .*/minSdkVersion = 24/' android/variables.gradle
          # Add the AdMob App ID to the manifest
          python3 - <<'PY'
          import os
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          key = 'com.google.android.gms.ads.APPLICATION_ID'
          if key not in s:
              meta = '<meta-data android:name="%s" android:value="%s" />' % (key, os.environ['ADMOB_APP_ID'])
              s = s.replace('</application>', '    ' + meta + '\n    </application>')
              open(p, 'w').write(s)
          PY
          grep -n "APPLICATION_ID" android/app/src/main/AndroidManifest.xml

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: english-syntax-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
